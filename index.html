            .chat{background:#EAF1FA;border-radius:12px;padding:11px;margin:8px 0;max-width:90%;overflow-wrap:anywhere}.chat.mine{margin-left:auto;background:#E7F7EE}
            .notice{padding:11px;border-radius:12px;background:#FFF6E8;color:#84500B;font-size:12px;line-height:1.45;margin:12px 0}
            .error{color:#B42318;background:#FEF3F2;padding:10px;border-radius:10px;font-size:13px}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #E1E7EF;border-radius:12px;padding:13px;margin:8px 0}

            .category-item.selected{border:2px solid var(--blue);background:#EDF4FF}

            body.screen-open{overflow:hidden;height:100dvh}
            #screenLayer .full-screen-view{position:absolute;inset:0;z-index:1;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
            #screenLayer .full-screen-view{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-height:100dvh!important;z-index:2147483647!important;background:var(--bg)!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
            #screenLayer .full-screen-content{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important}
            .full-screen-header{flex:0 0 auto;min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));box-shadow:0 1px 5px #0001}
            .full-screen-header button{border:0;background:#EDF4FF;color:var(--blue);border-radius:10px;padding:10px 13px;font-weight:850;white-space:nowrap}
            .full-screen-header strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            .full-screen-content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 15px 28px;max-width:760px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
            .full-screen-content .card{margin-top:8px}

            @media(min-width:900px){main{max-width:1080px;padding:28px 28px 110px}nav{justify-content:center;gap:30px}nav button{font-size:13px;padding:10px 14px}.card{padding:20px}}
            
.chamae-notification-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:#e65b35;color:#fff;font-size:11px;font-weight:800;line-height:18px}

.notification-row:focus{outline:2px solid var(--primary,#2463a6);outline-offset:2px}

            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script>
            'use strict';
            const SUPABASE_URL='https://rteeynlktogwjbjxezwr.supabase.co';
            const SUPABASE_ANON_KEY='sb_publishable_p1JjWeb5D4l-TIGIKK5e8w_5z5j4_V6';
            if(!window.supabase?.createClient){document.getElementById('app').innerHTML='<div class="error">Não foi possível carregar a conexão do Chamaê. Verifique sua internet e recarregue a página.</div>';throw new Error('Biblioteca Supabase não carregou.')}
            const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
            const $=id=>document.getElementById(id);
            const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            let session=null,user=null,profile=null,tab='home',selected=null,selectedServiceId=null,selectedCategory=null,selectedProviderId=null,activeBooking=null;let cancelledCleanupAttempted=false;
            let providers=[],services=[],bookings=[],messages=[],notifications=[],ratedBookingIds=[],loyaltyBonuses=[],loyaltyProgress={};let providersLoadError='',servicesLoadError='';
            let favorites=[];try{favorites=JSON.parse(localStorage.getItem('chamae_favorites')||'[]');if(!Array.isArray(favorites))favorites=[]}catch{favorites=[]}
            let chatRealtime=null,bookingRealtime=null,notificationRealtime=null;
            let renderVersion=0,bookingsLoadError='',chatLoadError='',notificationLoadError='';
            let searchRenderTimer=null;
            let isAdmin=false;
            const BASE_CATEGORIES=['Diarista','Manicure','Eletricista','Encanador','Babá','Cuidador de idosos','Personal trainer','Professor de música','Professor de idiomas','Pedreiro','Jardineiro','Serviços gerais','Multi serviços','Pintor','Mecânico','Marceneiro','Fotógrafo','Professor particular','Cuidador de pets'];
            function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
            function validCPF(value){let c=String(value||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;let calc=(base,factor)=>{let sum=0;for(let n of base)sum+=Number(n)*factor--;let r=(sum*10)%11;return r===10?0:r};return calc(c.slice(0,9),10)===Number(c[9])&&calc(c.slice(0,10),11)===Number(c[10])}
            function arg(s=''){return JSON.stringify(String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
            function card(s){return `<section class="card">${s}</section>`}
            function btn(t,fn,k=''){return `<button class="action ${k}" onclick="${fn}">${t}</button>`}
            function notice(s,k='notice'){return `<div class="${k}">${esc(s)}</div>`}
            function dateToday(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
            function icon(c=''){c=String(c).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(/diarist|limpeza|faxin/.test(c))return'🧹';if(/manicur|unha/.test(c))return'💅';if(/eletric/.test(c))return'⚡';if(/encan|hidraul/.test(c))return'🔧';if(/bab|cuidador/.test(c))return'🧸';if(/jardina/.test(c))return'🌿';if(/pintor/.test(c))return'🖌️';if(/pedreir|reforma/.test(c))return'🧱';if(/pet|animal/.test(c))return'🐾';if(/mecan|autom/.test(c))return'🚗';if(/personal/.test(c))return'🏋️';if(/professor|aula/.test(c))return'📚';return'🧰'}
            async function clearChannel(ch){if(ch)try{await db.removeChannel(ch)}catch(e){console.warn('Falha ao encerrar canal realtime:',e)}}
            async function clearRealtime(){await Promise.all([clearChannel(chatRealtime),clearChannel(bookingRealtime),clearChannel(notificationRealtime)]);chatRealtime=bookingRealtime=notificationRealtime=null}
            async function loadProfile(){if(!user)return;let{data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;profile=data}
            async function ensureProfile(full='',phone='',role=null){
             if(!user)return;
             if(profile)return profile;
             let meta=user.user_metadata||{},safe=role||meta.role||'cliente';
             if(!['cliente','prestador'].includes(safe))safe='cliente';
             let payload={id:user.id,full_name:full||meta.full_name||user.email?.split('@')[0]||'Usuário',phone:phone||meta.phone||null,role:safe};
             let{data,error}=await db.from('profiles').insert(payload).select().single();
             if(error){
              if(error.code==='23505'){const retry=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(retry.error)throw retry.error;if(retry.data){profile=retry.data;return profile}}
              throw error;
             }
             profile=data;return profile;
            }
            async function loadProviders(){let{data,error}=await db.from('providers').select('id,user_id,name,category,area,rating,half_day_price,full_day_price,about,available').order('created_at',{ascending:false});if(error){console.warn('Falha ao carregar profissionais:',error);providers=[];providersLoadError=error.message||'Não foi possível carregar os profissionais.'}else{providers=data||[];providersLoadError=''}}
            async function loadServices(){let{data,error}=await db.from('services').select('*').order('created_at',{ascending:false});if(error){console.warn('Falha ao carregar serviços:',error);services=[];servicesLoadError=error.message||'Não foi possível carregar os serviços.'}else{services=data||[];servicesLoadError=''}}
            async function loadBookings(){if(!user){bookings=[];bookingsLoadError='';return}if(!cancelledCleanupAttempted){cancelledCleanupAttempted=true;const cleanup=await db.from('bookings').delete().eq('status','cancelled').select('id');if(cleanup.error)console.warn('Não foi possível excluir todos os serviços cancelados:',cleanup.error)}let{data,error}=await db.from('bookings').select('*').neq('status','cancelled').order('created_at',{ascending:false});if(error){console.warn(error);bookings=[];bookingsLoadError=error.message||'Falha ao carregar contratações.'}else{bookings=data||[];bookingsLoadError=''}}
            async function loadNotifications(){if(!user){notifications=[];return}let{data,error}=await db.from('notifications').select('*').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(30);if(error){console.warn('Falha ao carregar notificações:',error);notifications=[];notificationLoadError=error.message||'Não foi possível carregar as notificações.'}else{notifications=data||[];notificationLoadError=''}}
            async function loadRated(){ratedBookingIds=[];let ids=bookings.filter(b=>b.client_id===user?.id&&b.status==='completed').map(b=>b.id);if(!ids.length)return;let{data,error}=await db.from('ratings').select('booking_id').in('booking_id',ids);if(!error)ratedBookingIds=(data||[]).map(x=>x.booking_id)}
            async function loadLoyalty(){loyaltyBonuses=[];loyaltyProgress={};if(!user||profile?.role!=='prestador')return;let ids=providers.filter(p=>p.user_id===user.id).map(p=>p.id);if(!ids.length)return;let{data,error}=await db.from('provider_loyalty_bonuses').select('*').in('provider_id',ids).order('created_at',{ascending:false});if(error){console.warn(error);return}loyaltyBonuses=data||[];let{data:r,error:re}=await db.from('ratings').select('booking_id,provider_id').in('provider_id',ids).eq('score',5);if(re)return;let bookingIds=[...new Set((r||[]).map(x=>x.booking_id))],completed=[];if(bookingIds.length){let q=await db.from('bookings').select('id,provider_id').in('id',bookingIds).eq('status','completed');completed=q.data||[]}for(let id of ids){let n=completed.filter(b=>b.provider_id===id).length;loyaltyProgress[id]={total:n,completed:n%10,remaining:10-n%10}}}
            function loyaltyView(ids){let rows=loyaltyBonuses.filter(x=>ids.includes(x.provider_id)),total=rows.reduce((a,x)=>a+Number(x.bonus_amount||0),0);return card(`<h2>Programa de fidelidade</h2><p class="sub">A cada 10 serviços concluídos com avaliação de 5 estrelas, bônus de 10% sobre o valor-base do décimo serviço do ciclo.</p>${ids.map(id=>{let p=providers.find(x=>x.id===id),d=loyaltyProgress[id]||{total:0,completed:0,remaining:10};return `<div class="service-row"><b>${esc(p?.name||'Profissional')}</b><p class="sub">${d.completed}/10 avaliações qualificadas · faltam ${d.remaining}</p><div style="height:9px;background:#e3eaf2;border-radius:10px"><div style="height:9px;width:${d.completed*10}%;background:#168653;border-radius:10px"></div></div></div>`}).join('')}<div class="between"><span class="sub">Bônus registrados</span><b class="price">${money(total)}</b></div>${rows.map(x=>`<p class="sub">Ciclo ${x.milestone_number}: ${money(x.bonus_amount)} · ${esc(x.status)}</p>`).join('')||'<p class="sub">Nenhum bônus registrado.</p>'}`)}
            async function isVerified(id){let{data,error}=await db.from('provider_verifications').select('status').eq('provider_id',id).eq('status','verified').maybeSingle();return!error&&data?.status==='verified'}
            async function verifiedProviders(list){const checks=await Promise.all(list.map(async p=>({provider:p,verified:await isVerified(p.id)})));return checks.filter(x=>x.verified).map(x=>({...x.provider,_verified:true}))}
            async function checkAdmin(){isAdmin=false;if(!user)return false;const{data,error}=await db.rpc('chamae_is_admin');if(error){console.warn('Falha ao verificar acesso administrativo:',error);return false}isAdmin=data===true;return isAdmin}
            async function adminView(){
 if(!user)return `<h1>Administração</h1>${notice('Entre em uma conta autorizada.','error')}`;
 const authorized=await checkAdmin();
 if(!authorized)return `<h1>Administração</h1>${notice('Acesso administrativo não autorizado.','error')}`;
 return `<h1>Painel administrativo</h1>
 ${card(`<h2>Verificação automática de profissionais</h2>
 <p class="sub">A aprovação manual de documentos foi desativada nesta interface. O Supabase executa a validação automática e sincroniza o estado do cadastro.</p>
 <p class="notice">A validação automática verifica consistência dos dados e disponibilidade dos arquivos. Ela não comprova, por si só, a autenticidade material do documento nem realiza biometria.</p>
 <button class="link" onclick="render()">Atualizar painel</button>`)}`;
}
async function reviewDocument(){
 alert('A aprovação manual de documentos está desativada. A verificação é realizada automaticamente pelo Supabase.');
}
function authView(){if(recoveryMode)return '<h1>Redefinir senha</h1><p class="sub">Escolha uma nova senha para sua conta.</p>'+card(`<input id="recoveryPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Nova senha (mínimo 6 caracteres)">${btn('Salvar nova senha','updateRecoveredPassword()')}`);return `<h1>Bem-vindo ao Chamaê</h1><p class="sub">Entre ou crie sua conta para contratar serviços ou oferecer seu trabalho.</p>${card(`<h2>Entrar</h2><input id="loginEmail" type="email" autocomplete="username" placeholder="Seu e-mail"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Sua senha">${btn('Entrar','login()')}<button class="link" type="button" onclick="forgotPassword()">Esqueci minha senha</button><hr><h2>Criar conta</h2><input id="newName" placeholder="Nome completo"><input id="newPhone" placeholder="Telefone / WhatsApp"><input id="newEmail" type="email" autocomplete="email" placeholder="E-mail"><input id="newPass" type="password" autocomplete="new-password" minlength="6" placeholder="Senha (mínimo 6 caracteres)"><select id="newRole"><option value="cliente">Quero contratar serviços</option><option value="prestador">Quero oferecer serviços</option></select>${btn('Criar minha conta','signup()','orange')}<p class="sub">A confirmação de cadastro segue a configuração do Supabase Auth.</p>`)}`}            async function login(){
             const email=$('loginEmail')?.value.trim(),password=$('loginPass')?.value;
             if(!email||!password)return alert('Informe e-mail e senha.');
             const{data,error}=await db.auth.signInWithPassword({email,password});
             if(error)return alert(error.message);
             try{await applyAuthSession(data.session);tab='home';await render()}
             catch(e){console.error(e);alert('Login realizado, mas não foi possível carregar seus dados: '+e.message)}
            }
            async function signup(){
             const full=$('newName')?.value.trim()||'',phone=$('newPhone')?.value.trim()||'',email=$('newEmail')?.value.trim()||'',password=$('newPass')?.value||'',role=$('newRole')?.value;
             if(full.length<2||full.length>100)return alert('Informe seu nome completo (2 a 100 caracteres).');
             if(!email||!/^\S+@\S+\.\S+$/.test(email))return alert('Informe um e-mail válido.');
             if(password.length<6)return alert('A senha deve ter pelo menos 6 caracteres.');
             if(phone.length>25)return alert('O telefone deve ter no máximo 25 caracteres.');
             if(!['cliente','prestador'].includes(role))return alert('Selecione um tipo de conta válido.');
             const{data,error}=await db.auth.signUp({email,password,options:{data:{full_name:full,phone,role}}});
             if(error)return alert(error.message);
             if(data.session){
              try{await applyAuthSession(data.session);tab='profile';await render();alert('Conta criada!')}
              catch(e){console.error(e);alert('Conta criada, mas não foi possível carregar o perfil: '+e.message)}
             }else alert('Conta criada. Confirme seu e-mail e depois entre no aplicativo.');
            }
            async function forgotPassword(){
             const email=$('loginEmail')?.value.trim();
             if(!email)return alert('Digite seu e-mail no campo de entrada para receber o link de recuperação.');
             const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
             if(error)return alert('Não foi possível enviar a recuperação: '+error.message);
             alert('Se o e-mail estiver cadastrado, você receberá as instruções de recuperação. Verifique também a caixa de spam.');
            }
            let authReady=false,authQueue=Promise.resolve(),authGeneration=0,recoveryMode=false;
            async function updateRecoveredPassword(){
             const password=$('recoveryPassword')?.value||'';
             if(password.length<6)return alert('A nova senha deve ter pelo menos 6 caracteres.');
             const{error}=await db.auth.updateUser({password});
             if(error)return alert('Não foi possível atualizar a senha: '+error.message);

            async function deleteBooking(id){

async function changeStatus(id,status){
             try{
              if(!user)return alert('Entre na sua conta novamente.');
              const fields={accepted:'accepted_at',rejected:'rejected_at',in_progress:'started_at',completed:'completed_at',cancelled:'cancelled_at'};
              if(!fields[status])return alert('Status inválido.');
              const booking=bookings.find(b=>b.id===id);
              if(!booking)return alert('Contratação não encontrada. Atualize a tela e tente novamente.');
              const isProvider=providers.some(p=>p.id===booking.provider_id&&p.user_id===user.id);
              const isClient=booking.client_id===user.id;
              const providerTransitions={pending:['accepted','rejected'],accepted:['in_progress'],in_progress:['completed']};
              const permitted=(isProvider&&(providerTransitions[booking.status]||[]).includes(status))||(isClient&&['pending','accepted'].includes(booking.status)&&status==='cancelled');
              if(!permitted)return alert('Sua conta não tem permissão para esta alteração ou o status atual não permite essa etapa.');
              if(status==='accepted'){
               const provider=providers.find(p=>p.id===booking.provider_id&&p.user_id===user.id);
               if(!provider||provider.available!==true)return alert('Seu perfil profissional está indisponível. Ative-o antes de aceitar solicitações.');
              }
              if(!confirm('Confirmar esta alteração?'))return;
              const update={status,[fields[status]]:new Date().toISOString()};
              const{data,error}=await db.from('bookings').update(update).eq('id',id).eq('status',booking.status).select('id,status').maybeSingle();
              if(error)throw error;
              if(!data)return alert('A contratação foi alterada por outra ação ou você não tem permissão. Atualize a tela.');
              await loadBookings();await loadNotifications();await loadRated();await render();
              alert('Status atualizado: '+statusLabel(data.status));
             }catch(e){console.error('Erro ao atualizar contratação:',e);alert('Não foi possível atualizar a contratação: '+(e.message||e))}
            }

              if(payload.description.length>1500)return alert('A descrição deve ter no máximo 1.500 caracteres.');
              if([payload.price,payload.half_day_price,payload.full_day_price].some(x=>x!==null&&(!Number.isFinite(x)||x<=0)))return alert('Preços devem ser números maiores que zero.');
              if(![payload.price,payload.half_day_price,payload.full_day_price].some(x=>x!==null))return alert('Informe pelo menos um preço.');
              let q;
              if(id){
               const existing=services.find(s=>s.id===id&&s.provider_id===pid);
               if(!existing)return alert('Serviço não encontrado neste perfil. Atualize a tela e tente novamente.');
               q=await db.from('services').update(payload).eq('id',id).eq('provider_id',pid).select('id').single();
              }else{
               q=await db.from('services').insert(payload).select('id').single();
              }
              if(q.error)throw q.error;
              if(!q.data?.id)throw new Error('O banco não confirmou a gravação do serviço.');
              await loadServices();await render();alert('Serviço salvo com sucesso!');
             }catch(e){console.error('Erro ao salvar serviço:',e);alert('Não foi possível salvar o serviço: '+(e.message||e))}
            }
            async function deleteService(id){try{const service=services.find(s=>s.id===id);if(!user||profile?.role!=='prestador'||!service||!providers.some(p=>p.id===service.provider_id&&p.user_id===user.id))return alert('Você não tem permissão para desativar este serviço.');if(!confirm('Desativar este serviço? O histórico será preservado.'))return;const{data,error}=await db.from('services').update({available:false}).eq('id',id).eq('provider_id',service.provider_id).select('id').single();if(error)throw error;if(!data?.id)throw new Error('O banco não confirmou a desativação.');await loadServices();await render();alert('Serviço desativado.')}catch(e){console.error('Erro ao desativar serviço:',e);alert('Não foi possível desativar o serviço: '+(e.message||e))}}
            async function saveProfile(){
             if(!user)return alert('Entre na sua conta novamente.');
             const full=$('profileName')?.value.trim()||'',phone=$('profilePhone')?.value.trim()||'';
             if(full.length<2||full.length>100)return alert('Informe um nome entre 2 e 100 caracteres.');
             if(phone.length>25)return alert('O telefone deve ter no máximo 25 caracteres.');
             const{data,error}=await db.from('profiles').update({full_name:full,phone:phone||null}).eq('id',user.id).select().single();
             if(error)return alert('Não foi possível salvar seu perfil: '+error.message);
             profile=data;
             const{error:metaError}=await db.auth.updateUser({data:{full_name:full,phone}});
             if(metaError)console.warn('Os dados foram salvos no perfil, mas não foi possível atualizar os metadados:',metaError);
             await render();alert('Perfil atualizado.');
            }
            function profileView(){if(!user)return authView();return `<h1>Meu perfil</h1>${card(`<h2>Dados pessoais</h2><label class="sub" for="profileName">Nome completo</label><input id="profileName" maxlength="100" value="${esc(profile?.full_name||user.user_metadata?.full_name||'')}" autocomplete="name"><label class="sub" for="profilePhone">Telefone / WhatsApp</label><input id="profilePhone" type="tel" maxlength="25" value="${esc(profile?.phone||user.user_metadata?.phone||'')}" autocomplete="tel"><label class="sub">E-mail da conta</label><p>${esc(user.email||'')}</p><label class="sub">Tipo de conta</label><p>${esc(profile?.role||'não definido')}</p>${btn('Salvar alterações','saveProfile()')}${btn('Sair da conta','logout()','secondary')}`)}<p class="notice">Seus dados pessoais são usados para identificar sua conta. A alteração do tipo de conta não é feita nesta tela.</p>`}
            async function render(){
             const version=++renderVersion,currentTab=tab;
             const layer=$('screenLayer'),app=$('app');
             if(recoveryMode){layer.innerHTML='';layer.style.display='none';document.body.classList.remove('screen-open');app.innerHTML=authView();return}
             const views={home,orders,favorites:favoritesPage,chat:chatView,provider:providerArea,admin:adminView,profile:profileView};
             let result=await(views[currentTab]||home)();
             if(version!==renderVersion||currentTab!==tab)return;
             const useScreenLayer=currentTab==='home'&&!!(selectedCategory||selected);
             if(useScreenLayer){
              if(layer.parentElement!==document.body)document.body.appendChild(layer);
              app.innerHTML='';
              layer.innerHTML=result;
              layer.style.setProperty('position','fixed','important');
              layer.style.setProperty('inset','0','important');
              layer.style.setProperty('width','100vw','important');
              layer.style.setProperty('height','100dvh','important');
              layer.style.setProperty('display','block','important');
              layer.style.setProperty('z-index','2147483647','important');
              layer.style.setProperty('overflow','hidden','important');
              layer.style.setProperty('background','var(--bg)','important');
              document.body.classList.add('screen-open');
              document.body.style.setProperty('overflow','hidden');
              document.body.style.setProperty('height','100dvh');
             }else{
              layer.innerHTML='';
              layer.style.removeProperty('position');layer.style.removeProperty('inset');layer.style.removeProperty('width');layer.style.removeProperty('height');layer.style.removeProperty('z-index');layer.style.removeProperty('overflow');layer.style.removeProperty('background');
              layer.style.display='none';
              document.body.classList.remove('screen-open');
              document.body.style.removeProperty('overflow');document.body.style.removeProperty('height');
              app.innerHTML=result;
             }
             document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
             const adminButton=$('adminTab');if(adminButton)adminButton.style.display=isAdmin?'':'none';
             updateNotificationBadge();
            }
            document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',async()=>{const nextTab=b.dataset.tab;if(nextTab==='admin'&&!isAdmin){tab='home';return render()}if(nextTab!=='chat'){await clearChannel(chatRealtime);chatRealtime=null}tab=nextTab;if(tab==='chat'&&(!activeBooking||!canAccessBooking(bookings.find(x=>x.id===activeBooking))))activeBooking=bookings.find(canAccessBooking)?.id||null;if(tab==='chat'&&activeBooking){await loadMessages();await render();await subscribeChat()}else await render()}));
            db.auth.onAuthStateChange((event,nextSession)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;render()}authQueue=authQueue.then(()=>applyAuthSession(nextSession)).catch(e=>{console.error('Erro ao atualizar autenticação:',e);$('app').innerHTML=notice('Erro ao atualizar sua sessão: '+e.message,'error')})});
            async function init(){const{data,error}=await db.auth.getSession();if(error)throw error;authQueue=authQueue.then(()=>applyAuthSession(data.session));await authQueue}
            init().catch(e=>{$('app').innerHTML=notice('Erro ao iniciar o Chamaê: '+e.message,'error')});
            </script>
            </body>
            </html>
